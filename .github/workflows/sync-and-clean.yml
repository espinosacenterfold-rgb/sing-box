name: Sync and clean upstream

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4

      - name: Import and clean upstream
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/upstream
          git clone --depth 1 https://github.com/233boy/sing-box.git /tmp/upstream

          # Preserve the target repository's .git directory and credentials.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude='.git' /tmp/upstream/ ./
          rm -f .github/workflows/sync-and-clean.yml

          python3 - <<'PY'
          from pathlib import Path
          import re

          repo = "https://github.com/espinosacenterfold-rgb/sing-box"
          replacements = [
              ("https://github.com/233boy/sing-box", repo),
              ("https://t.me/tg2333", ""),
              ("tg2333", ""),
              ("233boy.github.io", ""),
              ("#233boy-", "#"),
              ("by 233boy", "by local build"),
              ("author=233boy", "author=local-build"),
              ("is_socks_user=233boy", "is_socks_user=singbox"),
              ("233boy.com", "example.com"),
              ("233boy", "upstream"),
          ]

          url_re = re.compile(r"https://233boy\.com/[^\\s\"'<>)]*")
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              original = text
              text = url_re.sub(repo, text)
              for old, new in replacements:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')

          p = Path('install.sh')
          if p.exists():
              text = p.read_text(encoding='utf-8')
              text = re.sub(r'is_sh_repo=\$author/\$is_core', 'is_sh_repo=espinosacenterfold-rgb/$is_core', text)
              p.write_text(text, encoding='utf-8')

          p = Path('src/init.sh')
          if p.exists():
              text = p.read_text(encoding='utf-8')
              text = text.replace('author=upstream', 'author=local-build')
              text = text.replace('github=https://github.com/upstream/sing-box', f'github={repo}')
              p.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          if readme.exists():
              body = readme.read_text(encoding='utf-8')
              notice = '> This repository is a modified derivative of the upstream project. Local modifications include branding and repository-link cleanup. Modified 2026-09-15.\n\n'
              if 'This repository is a modified derivative' not in body:
                  readme.write_text(notice + body, encoding='utf-8')
          PY

          if grep -RIn --exclude-dir=.git -E '233boy|233boy\.com|tg2333' .; then
            echo 'Upstream branding remains; aborting.'
            exit 1
          fi

          rm -f .sync-trigger
          git config user.name 'espinosacenterfold-rgb'
          git config user.email 'espinosacenterfold@gmail.com'
          git add -A
          git commit -m 'Import upstream and clean branding'
          git push origin main
